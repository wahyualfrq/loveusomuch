<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player & Downloader</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <!-- Unified Clean Portrait Card (Match Reference UI) -->
            <div class="portrait-card">
                <!-- 9:16 Video Frame -->
                <div class="video-wrapper" id="video-frame">
                    <video id="video-element" 
                           autoplay 
                           loop 
                           muted 
                           playsinline 
                           preload="auto" 
                           src="https://github.com/wahyualfrq/loveusomuch/releases/download/v1/copy_E7C528BA-8515-4805-9791-3849F38EE832.mov">
                         Browsermu tidak mendukung pemutaran video HTML5.
                    </video>
                    <!-- Hidden file input for optional video changing -->
                    <input type="file" id="video-input" accept="video/mp4,video/webm,video/ogg,video/quicktime,video/x-matroska" hidden>
                </div>

                <!-- Integrated Bottom Bar (Exact Reference Style, No Skip Button) -->
                <div class="bottom-control-bar">
                    <!-- Circular Glowing Blue Play/Pause Button -->
                    <button class="circle-play-btn" id="btn-play-pause" title="Play / Pause">
                        <svg class="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16" rx="1"/>
                            <rect x="14" y="4" width="4" height="16" rx="1"/>
                        </svg>
                        <svg class="icon-play hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="6 3 20 12 6 21 6 3"/>
                        </svg>
                    </button>

                    <!-- Progress Bar & Time Display -->
                    <div class="progress-section">
                        <div class="progress-bar-track" id="progress-track">
                            <div class="progress-bar-fill" id="progress-fill"></div>
                        </div>
                        <span class="time-display" id="time-display">0:00</span>
                    </div>

                    <!-- Single Download / Save Button (NO SKIP BUTTON) -->
                    <a id="download-btn" class="btn-download-save" href="https://github.com/wahyualfrq/loveusomuch/releases/download/v1/copy_E7C528BA-8515-4805-9791-3849F38EE832.mov" download="loveusomuch.mov" target="_blank" rel="noopener noreferrer">
                        <svg class="download-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="download-btn-text">Download</span>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
